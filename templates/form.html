<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Classification Input</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Weather Classification</h1>
        <p class="subtitle">Enter measurements below</p>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/">
            <div class="form-group">
                <label for="temperature">Temperature (F)</label>
                <input type="number" step="any" id="temperature" name="temperature" required>
            </div>
            
            <div class="form-group">
                <label for="pressure">Pressure</label>
                <input type="number" step="any" id="pressure" name="pressure" required>
            </div>
            
            <div class="form-group">
                <label for="humidity">Humidity</label>
                <input type="number" step="any" id="humidity" name="humidity" required>
            </div>
            
            <div class="form-group">
                <label for="wind_speed">Wind Speed</label>
                <input type="number" step="any" id="wind_speed" name="wind_speed" required>
            </div>
            
            <div class="form-group">
                <label for="wind_deg">Wind Degree</label>
                <input type="number" step="any" id="wind_deg" name="wind_deg" required>
            </div>
            
            <div class="form-group">
                <label for="rain_1h">Rain 1h</label>
                <input type="number" step="any" id="rain_1h" name="rain_1h">
            </div>
            
            <div class="form-group">
                <label for="rain_3h">Rain 3h</label>
                <input type="number" step="any" id="rain_3h" name="rain_3h">
            </div>
            
            <div class="form-group">
                <label for="snow">Snow</label>
                <input type="number" step="any" id="snow" name="snow">
            </div>
            
            <div class="form-group">
                <label for="clouds">Clouds</label>
                <input type="number" step="any" id="clouds" name="clouds">
            </div>
            
            <button type="submit">Predict</button>
        </form>
    </div>
</body>
</html>
