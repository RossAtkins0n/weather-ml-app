name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  push-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}

    env:
      IMAGE_NAME: 13mj/weather-ml-app
      HAS_KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA != '' }} 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify DockerHub login
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Error: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets are not set"
            exit 1
          fi
          echo "Logged in as: ${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

#build and push to docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

#config kubectl (only if KUBE_CONFIG_DATA secret is set)
      - name: Install kubectl
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Set up kubectl
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          # Verify the config file is valid YAML
          if ! kubectl config view --raw &>/dev/null; then
            echo "Error: Invalid kubeconfig file"
            echo "First 200 characters of decoded config:"
            head -c 200 $HOME/.kube/config
            exit 1
          fi
          echo "Kubeconfig file created and validated successfully"
      
      - name: Verify Kubernetes cluster connection
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          if ! kubectl cluster-info &>/dev/null; then
            echo "Warning: Could not connect to cluster, but continuing..."
          else
            echo "Successfully connected to cluster:"
            kubectl cluster-info
          fi

#apply k8s manifests (only if KUBE_CONFIG_DATA is set)
      - name: Apply Kubernetes manifests
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          kubectl apply -f k8s/ --validate=false

#update deployment image and wait for rolling update (only if KUBE_CONFIG_DATA is set)
      - name: Update deployment image
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          kubectl set image deployment/weather-ml-app \
            weather-ml-app=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --record

      - name: Wait for rollout to complete
        if: env.HAS_KUBE_CONFIG == 'true'
        run: |
          kubectl rollout status deployment/weather-ml-app --timeout=180s
      
      - name: Kubernetes deployment skipped
        if: env.HAS_KUBE_CONFIG != 'true'
        run: |
          echo "Kubernetes deployment skipped - KUBE_CONFIG_DATA secret not set"
          echo "Docker image built and pushed successfully: ${{ env.IMAGE_NAME }}"
          echo "To enable Kubernetes deployment, add KUBE_CONFIG_DATA secret to your repository"