name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  push-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) }}

    env:
      IMAGE_NAME: 13mj/weather-ml-app
      HAS_GCP_SA: ${{ secrets.GCP_SA_KEY != '' }}
      GCP_PROJECT_ID: weather-ml-app-479520
      GCP_CLUSTER_NAME: weather-cluster
      GCP_REGION: europe-west1 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify DockerHub login
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Error: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secrets are not set"
            exit 1
          fi
          echo "Logged in as: ${{ secrets.DOCKERHUB_USERNAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

#build and push to docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

#config kubectl (only if GCP_SA_KEY secret is set)
      - name: Authenticate to Google Cloud
        if: env.HAS_GCP_SA == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        if: env.HAS_GCP_SA == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'
      
      - name: Install kubectl
        if: env.HAS_GCP_SA == 'true'
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
      
      - name: Install gke-gcloud-auth-plugin
        if: env.HAS_GCP_SA == 'true'
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
      
      - name: Get GKE credentials
        if: env.HAS_GCP_SA == 'true'
        run: |
          gcloud container clusters get-credentials ${{ env.GCP_CLUSTER_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }}
      
      - name: Verify Kubernetes cluster connection
        if: env.HAS_GCP_SA == 'true'
        run: |
          kubectl cluster-info
          kubectl get nodes

#apply k8s manifests (only if GCP_SA_KEY is set)
      - name: Apply Kubernetes manifests
        if: env.HAS_GCP_SA == 'true'
        run: |
          kubectl apply -f k8s/ --validate=false

#update deployment image and wait for rolling update (only if GCP_SA_KEY is set)
      - name: Update deployment image
        if: env.HAS_GCP_SA == 'true'
        run: |
          kubectl set image deployment/weather-ml-app \
            weather-ml-app=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --record

      - name: Wait for rollout to complete
        if: env.HAS_GCP_SA == 'true'
        run: |
          kubectl rollout status deployment/weather-ml-app --timeout=180s