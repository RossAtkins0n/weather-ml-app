name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

 #flask install
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  
      - name: Run unit tests
        run: |
          python -m unittest unit_test

      - name: Run integration tests
        run: |
          python -m unittest integration_test

      - name: Run smoke tests
        run: |
          python -m unittest smoke_test

#docker build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t weather-ml-app:test .

      - name: Test Docker container launch
        run: |
          docker run -d --rm --name weather-ml-app-test -p 5000:5000 weather-ml-app:test
          sleep 10
          if docker ps | grep -q weather-ml-app-test; then
            echo "Container is running successfully"
            docker stop weather-ml-app-test
          else
            echo "Container failed to start"
            docker ps -a
            exit 1
          fi