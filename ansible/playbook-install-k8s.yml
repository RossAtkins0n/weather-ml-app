---
- name: Prepare Production Server (Install K8s Tools)
  hosts: all
  become: yes
  vars:
    minikube_version: "v1.32.0"
    kubectl_version: "v1.28.2"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install required system packages
      apt:
        name:
          - curl
          - wget
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - conntrack
        state: present

    - name: Install Docker (required driver for Minikube)
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add current user to docker group
      user:
        name: "{{ ansible_user | default(lookup('env', 'USER')) }}"
        groups: docker
        append: yes

    - name: Reset connection so docker group takes effect
      meta: reset_connection

    - name: Download Kubectl
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Download Minikube
      get_url:
        url: "https://storage.googleapis.com/minikube/releases/{{ minikube_version }}/minikube-linux-amd64"
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Start Minikube
      # Minikube usually shouldn't run as root, but for automation 'become: yes' makes us root.
      # We need to run it as the regular user.
      become: no
      command: minikube start --driver=docker
      register: minikube_start
      changed_when: "'Done!' in minikube_start.stdout"
      failed_when: 
        - minikube_start.rc != 0
        - "'is not in the docker group' not in minikube_start.stderr" 
        # Allow failure if group membership hasn't taken effect in current session yet, 
        # though usually we'd need to reset connection.

